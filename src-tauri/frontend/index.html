<!doctype html>
<meta charset="utf-8" />
<title>Phosphor</title>
<!--
  The only page Tauri itself serves. It is on screen for the couple of seconds the Node
  backend takes to bind its port, and it is replaced, not navigated: the real window is a
  separate webview pointed at http://127.0.0.1, so the page that holds the approval surface
  never shares an origin or a webview with anything Tauri controls.

  It is the app's own mark, in the state the mark already has a meaning for. In the window,
  the mark beside "Phosphor" sits at 0.35 opacity until the backend answers and then lights
  up (see .wordmark-glyph in ui/design/layout.css). So this screen is not a separate loading
  animation at all: it is that mark, not yet lit, on the same ground the window paints. When
  the real window arrives, the same mark is in the top left, on.

  THE COLOURWAY. The shell reads the profile line out of state/theme.json before it opens this
  window and hands it over as window.__PHOSPHOR_PROFILE__ in an initialization script, so a
  person who chose black on white is not shown two seconds of black first. The three blocks
  below are the same values as ui/design/tokens.css; only the tokens this page uses.
-->
<script>
  (function () {
    var wanted = window.__PHOSPHOR_PROFILE__;
    if (wanted === 'black-on-green' || wanted === 'black-on-white') {
      document.documentElement.setAttribute('data-profile', wanted);
    }
  })();
</script>
<style>
  /* Copied from ui/design/tokens.css rather than imported, because this page is served by
     Tauri and shares no origin with the app. Only the tokens this screen actually uses. */
  :root {
    color-scheme: dark;
    --bg-0: #0E0F13;
    --text: #ECEEF1;
    --text-2: #9BA1AB;
    --ink: #3FFF6C;
    --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
  }

  :root[data-profile="black-on-green"] {
    color-scheme: light;
    --bg-0: #3FFF6C;
    --text: #0E0F13;
    --text-2: #153D21;
    --ink: #0E0F13;
  }

  :root[data-profile="black-on-white"] {
    color-scheme: light;
    --bg-0: #FFFFFF;
    --text: #111111;
    --text-2: #5C6169;
    --ink: #111111;
  }

  @font-face {
    font-family: "Geist";
    src: url("Geist-Variable.woff2") format("woff2-variations");
    font-weight: 100 900;
    font-display: swap;
  }

  html, body {
    height: 100%;
    margin: 0;
    background: var(--bg-0);
    color: var(--text);
    font-family: "Geist", ui-sans-serif, system-ui, sans-serif;
    -webkit-user-select: none;
    user-select: none;
    overflow: hidden;
  }

  main {
    height: 100%;
    display: grid;
    place-content: center;
    justify-items: center;
    gap: 14px;
    text-align: center;
  }

  /* The mark the window draws, at the size a splash can afford, at the same not-ready
     opacity. It breathes rather than spins: a spinner would promise progress this screen
     cannot measure, and the one thing it honestly knows is that something is still coming. */
  .mark {
    width: 43px;
    height: 48px;
    color: var(--ink);
    opacity: 0.35;
    animation: waking 1800ms var(--ease-out) infinite;
  }

  .wordmark {
    font-size: 15px;
    font-weight: 500;
    letter-spacing: -0.01em;
  }

  p {
    margin: 0;
    font-size: 12px;
    color: var(--text-2);
  }

  @keyframes waking {
    0%, 100% { opacity: 0.28; }
    50%      { opacity: 0.72; }
  }

  @media (prefers-reduced-motion: reduce) {
    .mark { animation: none; opacity: 0.55; }
  }
</style>
