<!doctype html>
<meta charset="utf-8">
<title>PH0SPHOR X header</title>
<style>
  @font-face { font-family: 'Expose'; font-weight: 400 900; font-display: block;
    src: url('https://cdn.fontshare.com/wf/T2A367UCJGB6GAZ4WCL3XCCUBIMPYB77/KQQLILLRNU7AKC37AXIKYCPE3RYUAWJA/GZCWMSL56JZWKHAFJII2BVH4QQ6GBZMT.woff2') format('woff2'); }
  html, body { margin: 0; background: #ddd; }
  #out { display: block; max-width: 100%; }
</style>
<canvas id="out"></canvas>
<script src="draw.js"></script>
<script src="banner.js"></script>
<script>
window.render = (async () => {
  const c = document.getElementById('out');
  await document.fonts.load('600 700px Expose', 'PH0SPHOR');
  await document.fonts.ready;
  const guides = new URLSearchParams(location.search).get('guides') === '1';
  const info = drawBanner(c,
    { weight: 600, slashOvershoot: 0.65, cutGap: 0.34 },
    { guides });
  return { ...info, dataURL: c.toDataURL('image/png') };
})();
</script>
