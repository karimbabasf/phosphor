<!doctype html>
<meta charset="utf-8">
<title>PH0SPHOR</title>
<style>
  @font-face {
    font-family: 'Expose';
    src: url('https://cdn.fontshare.com/wf/T2A367UCJGB6GAZ4WCL3XCCUBIMPYB77/KQQLILLRNU7AKC37AXIKYCPE3RYUAWJA/GZCWMSL56JZWKHAFJII2BVH4QQ6GBZMT.woff2') format('woff2');
    font-weight: 400 900;
    font-display: block;
  }
  html, body { margin: 0; background: #ddd; }
  #out { display: block; max-width: 100%; }
</style>
<canvas id="out"></canvas>
<script src="draw.js"></script>
<script>
window.render = (async () => {
  const c = document.getElementById('out');
  await document.fonts.load('600 700px Expose', 'PH0SPHOR');
  await document.fonts.ready;
  // Colours come from the URL so one page draws both marks: black on white for print and
  // light contexts, phosphor green on near-black for the screen the app actually runs on.
  const q = new URLSearchParams(location.search);
  const ink = { fg: q.get('fg') || '#000', bg: q.get('bg') || '#fff' };
  const info = drawMark(c, { size: 700, weight: 600, slashOvershoot: 0.65, cutGap: 0.34, ...ink });
  return { ...info, ...ink, dataURL: c.toDataURL('image/png') };
})();
</script>
