name: Feature request
description: Something the app should do, or a rule the policy engine should know.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you are trying to do and where the app stops you.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you would want instead
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: What you tried
