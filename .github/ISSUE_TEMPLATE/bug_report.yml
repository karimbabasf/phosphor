name: Bug report
description: Something the app did that it should not have, or did not do that it should have.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        If this could move, expose or lose funds, stop and use [private reporting](https://github.com/karimbabasf/phosphor/security/advisories/new) instead. Never paste a key, a seed, a seat secret or a full address you care about.
  - type: input
    id: version
    attributes:
      label: Version
      description: Filled in for you when you come here from Help, then Report a Problem. Otherwise Phosphor > About Phosphor, or the commit if you run from source.
      placeholder: 0.7.0
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: macOS version
      description: Filled in for you from the Help menu. Otherwise Apple menu > About This Mac.
      placeholder: "26.0"
    validations:
      required: true
  - type: dropdown
    id: agent
    attributes:
      label: Agent
      description: The one you picked in the app, on first run or in the Vault tab's Agent panel.
      options:
        - Claude Code
        - Codex
        - Hermes
        - Grok bot
        - Another MCP agent
        - Claude Desktop or a chat app (no agent on this Mac)
        - No agent involved
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: What you did
      description: The exact steps, in order.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened
      description: Include the sentence the app or the policy engine showed, word for word.
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: The log
      description: Help, then Copy Log for a Report puts the newest audit lines on the clipboard, with this boot's secrets already removed. Paste them here. Transaction hashes are fine to leave in; they are public.
      render: json
  - type: textarea
    id: state
    attributes:
      label: Live state
      description: Network, gate state and the relevant policy rule, if you know them.
