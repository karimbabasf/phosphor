<!-- The mark, once, cut into its five pieces (brand/phosphor-mark.svg, the path data verbatim):
     m1 to m4 are the slabs from the back to the front, m5 the cut inside the front slab. Every
     mark in the window points here with <use>, so each is the colour of the element holding it,
     and ui/design/mark.css moves the pieces through the custom properties each one reads.
     The freeze glyph sits beside it, drawn on icons.js's grid and in its two tones. -->
<svg hidden aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
  <symbol id="phosphor-mark" viewBox="0 0 59.46 64.75">

    <path class="m3" style="fill-opacity: var(--m3, 1); fill: color-mix(in oklab, currentColor, #fff calc(var(--h3, 0) * 100%))" d="M21.09 58.66 L21.09 31.69 A8.936598294969773 8.936598294969773 0 0 1 25.55 23.95 L48.91 10.47 L56.75 14.99 L33.39 28.47 A8.936598294969773 8.936598294969773 0 0 0 28.92 36.21 L28.92 63.18 Z"/>
    <path class="m4" fill-rule="evenodd" style="fill-opacity: var(--m4, 1); fill: color-mix(in oklab, currentColor, #fff calc(var(--h4, 0) * 100%))" d="M31.63 64.75 L31.63 37.78 A8.936598294969773 8.936598294969773 0 0 1 36.10 30.04 L59.46 16.55 L59.46 36.50 A8.936598294969773 8.936598294969773 0 0 1 54.99 44.24 L39.89 52.95 L39.89 59.98 Z M39.89 43.66 L50.17 37.73 A5.522616923857726 5.522616923857726 0 0 0 52.93 32.94 L52.93 29.61 L42.65 35.54 A5.522616923857726 5.522616923857726 0 0 0 39.89 40.33 Z"/>

  <symbol id="i-freeze" viewBox="0 0 24 24">

    <path fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" d="M12 3.5v17M4.64 7.75l14.72 8.5M4.64 16.25l14.72-8.5M9.8 4.3L12 6.5l2.2-2.2M9.8 19.7L12 17.5l2.2 2.2M17.57 6.25l-.81 3 3.01.81M19.77 13.94l-3.01.81.81 3.01M6.43 6.25l.81 3-3.01.81M4.23 13.94l3.01.81-.81 3.01"/>

<div id="page">

  <!-- The bar: whose window this is at the left, which mode at the centre, and the brake at the
       right. Nothing in it reports state: the notice at the foot of the world (#notice) speaks
       only when something needs the person. The brake is one glyph at rest, and its confirm step
       is a small panel of its own under it, the one place in the window that is red. -->
  <header class="topbar" id="topbar">
    <div class="brand">
      <svg class="mark brand-mark" aria-hidden="true" focusable="false"><use href="#phosphor-mark"/></svg>
      <span class="brand-word">Phosphor</span>
    </div>

    <nav class="tabs" role="tablist" aria-label="Modes">
      <span class="tabs-indicator" id="tabs-indicator" aria-hidden="true"></span>
      <button class="tab" role="tab" data-tab="basic" data-surface="tab-basic" aria-selected="true">Basic</button>
      <button class="tab" role="tab" data-tab="pro" data-surface="tab-pro" aria-selected="false">Pro</button>
      <button class="tab" role="tab" data-tab="trade" data-surface="tab-trade" aria-selected="false">Trade</button>
      <button class="tab" role="tab" data-tab="vault" data-surface="tab-vault" aria-selected="false">Vault</button>
    </nav>

    <div class="bar-end">
      <div class="layout-wrap" id="layout-wrap">
        <button class="layout opens" id="btn-layout" type="button" aria-haspopup="menu" aria-expanded="false" aria-controls="bar-layout">
          <svg class="icon" aria-hidden="true" focusable="false"><use href="#i-layout"/></svg>
          <span>Layout</span>
        </button>
        <div class="layout-pop pop" id="bar-layout" role="menu" aria-label="Which panes are on screen" tabindex="-1">
          <div class="layers-rows" id="bar-layout-rows"></div>
        </div>
      </div>
      <div class="brake">
        <button class="brake-btn" id="btn-freeze" type="button" aria-haspopup="dialog" aria-expanded="false" aria-controls="brake-panel" aria-label="Freeze everything" title="Freeze everything">
          <svg class="icon" aria-hidden="true" focusable="false"><use href="#i-freeze"/></svg>
          <span class="brake-word" data-role="brake-word" hidden>Frozen</span>
        </button>
        <div class="brake-panel" id="brake-panel" role="dialog" aria-labelledby="brake-title" aria-describedby="brake-body" data-motion="pop" hidden>
          <p class="brake-title" id="brake-title"></p>
          <p class="brake-body" id="brake-body"></p>
          <div class="brake-actions">
            <button class="btn btn-quiet btn-sm" type="button" data-role="brake-keep"><span class="btn-label"></span></button>
            <button class="btn btn-sm" type="button" data-role="brake-go"><span class="btn-label"></span></button>
          </div>
        </div>
      </div>
    </div>
  </header>

  <div class="stage" id="stage" data-split="stage" data-surface="window">

    <aside class="conversation" id="conversation" aria-label="Your assistant" data-surface="assistant">
      <div class="conversation-body" id="conversation-body"></div>
      <div class="composer-host" id="composer-host"></div>
    </aside>

    <div class="split-v" data-split-handle="conversation" role="separator" aria-orientation="vertical" aria-label="Resize the conversation" tabindex="0"></div>

    <main class="world" id="views">
      <section class="view" id="view-basic" role="tabpanel" aria-label="Basic" data-active="true"></section>
      <section class="view" id="view-pro" role="tabpanel" aria-label="Pro"></section>
      <section class="view" id="view-trade" aria-label="Trading"></section>
      <section class="view" id="view-vault" role="tabpanel" aria-label="Vault"></section>

      <!-- One calm line, only while something needs the person: the app stopped answering,
           nothing can move, or the recovery phrase is not backed up. It sits at the foot of the
           world, which on Basic is the foot of the balances panel. -->
      <div class="notice" id="notice" role="status" hidden>
        <svg class="icon" aria-hidden="true" focusable="false"><use data-role="notice-icon" href="#i-warning"/></svg>
        <span class="notice-text" data-role="notice-text"></span>
        <button class="notice-act" type="button" data-role="notice-act" hidden></button>
      </div>
    </main>

  </div>

</div>

<div class="screen" id="screen-firstrun" data-motion="screen" hidden></div>
<div class="screen" id="screen-terms" data-motion="screen" hidden></div>
<div class="screen" id="screen-migrate" data-motion="screen" hidden></div>
