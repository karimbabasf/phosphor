      <button class="status-line bar-state" id="chip-backup" type="button" data-tone="warn" title="Open the Vault tab to back up" hidden>
        <span class="status-dot" aria-hidden="true"></span>
        <span>Not backed up</span>
      </button>
      <span class="bar-lock" id="chip-lock">
        <svg class="bar-lock-glyph" viewBox="0 0 16 16" focusable="false" aria-hidden="true"><path d="M5.5 7V5.25a2.5 2.5 0 0 1 5 0V7M3.75 7h8.5a1 1 0 0 1 1 1v4.5a1 1 0 0 1-1 1h-8.5a1 1 0 0 1-1-1V8a1 1 0 0 1 1-1z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span data-role="lock-text">Unlocked</span>
      </span>
      <span class="status-line bar-state" id="chip-feed" hidden>
        <span class="status-dot" aria-hidden="true"></span>
        <span data-role="feed-text">Live</span>
      </span>
      <button class="btn freeze" id="btn-freeze">
        <span class="btn-label">Freeze everything</span>
      </button>
    </div>
  </header>

  <div class="offline-bar" id="offline-bar" role="status" hidden>
    <span class="dot" aria-hidden="true"></span>
    <span data-role="offline-text"></span>
  </div>

  <div class="stage" id="stage" data-split="stage" data-surface="window">

    <aside class="conversation" id="conversation" aria-label="Your assistant" data-surface="assistant">
      <div id="field" class="pattern-field" aria-hidden="true"></div>
      <div class="conversation-body" id="conversation-body"></div>
      <div class="dock" id="overlay" role="region" aria-label="Waiting for you" hidden>
        <div class="dock-card" id="overlay-card"></div>
      </div>
      <div class="composer-host" id="composer-host"></div>
    </aside>

    <div class="split-v" data-split-handle="conversation" role="separator" aria-orientation="vertical" aria-label="Resize the conversation" tabindex="0"></div>

    <main class="world" id="views">
      <section class="view" id="view-basic" role="tabpanel" aria-label="Basic" data-active="true"></section>
      <section class="view" id="view-pro" role="tabpanel" aria-label="Pro"></section>
      <section class="view" id="view-trade" role="tabpanel" aria-label="Trade"></section>
      <section class="view" id="view-vault" role="tabpanel" aria-label="Vault"></section>
    </main>

  </div>

</div>

<div class="screen" id="screen-lock" hidden></div>
<div class="screen" id="screen-firstrun" hidden></div>
<div class="screen" id="screen-migrate" hidden></div>
