<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PHOSPHOR</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/style.css">
<link rel="stylesheet" href="/basic.css">
<!-- Only the display face is preloaded, and only because the balance is the first
     thing read on the basic screen. The mono is for addresses inside a dialog. -->
<link rel="preload" href="/fonts/amulya-var.woff2" as="font" type="font/woff2" crossorigin>
</head>
<body>
<!-- data-view is set by the server's state payload, never by the browser. The two
     screens both live in this page: swapping an attribute keeps one SSE stream, one
     session token and one approval code path, so the gate cannot drift between them. -->
<main id="page" data-view="pro">

  <!-- 1. STATUS -->
  <header class="statusbar" id="statusbar">
    <h1 class="ident">PHOSPHOR v0.3</h1>
    <span class="bar">&#9474;</span>
    <span class="field"><span class="k">held</span> <span class="v hi" id="stat-total">--</span> <span class="faint" id="stat-positions"></span></span>
    <span class="bar">&#9474;</span>
    <span class="field"><span class="k">agent</span> <span class="v" id="stat-agent">--</span></span>
    <span class="bar">&#9474;</span>
    <span class="field"><span class="k">policy</span> <span class="v" id="stat-policy">--</span></span>
    <span class="bar">&#9474;</span>
    <span class="field"><span class="k">mode</span> <span class="v" id="stat-mode">--</span></span>
    <button type="button" id="kill-btn" class="btn">[ KILL SWITCH: -- ]</button>
    <!-- Written AFTER the brake, deliberately. The comment above this bar states the rule:
         nothing focusable comes before the kill switch, so the keyboard reaches the thing
         that stops the machine before the thing that starts one. -->
    <button type="button" id="summon-btn" class="btn">[ SUMMON AGENT ]</button>
    <span class="cursor" aria-hidden="true">&#9608;</span>
  </header>
  <!-- Gate off is the more dangerous of the two banners: policy-unreadable fails
       closed, a disabled gate fails open. It sits first and it is inverted. -->
  <p class="banner gate-off" id="gate-banner" role="alert" hidden></p>
  <p class="banner" id="policy-banner" hidden>POLICY FILE UNREADABLE: ALL WRITES REFUSED</p>
  <p class="alert dim" id="alert" hidden></p>

  <!-- MECHANISM. Same panel, same renderer, same reason as the trading window: everything
       else on this page reports what already happened, and none of it can say that something
       is happening right now. On this surface that gap is longer, not shorter: a swap or an
       LP write is real chain work, tens of seconds, and until now the only sign of it was a
       row that eventually changed. See ui/mechanism.js.

       Outside .deck so it cannot take height from the two columns, and fixed height so it can
       never move them. -->
  <section class="panel panel-mech" id="panel-mech">
    <div class="frame frame-top" data-title="MECHANISM" data-collapse="mech"></div>
    <div class="pbody">
      <div class="mechwrap" id="mechwrap" role="img"
           aria-label="agent activity: the drive train turns while the agent is working">
        <canvas id="mech"></canvas>
      </div>
      <p class="mechline" role="status">
        <span class="k">agent</span>
        <span class="v dim" id="mech-state">idle</span>
        <span class="bar">&#9474;</span>
        <span class="v" id="mech-label">--</span>
        <span class="dim" id="mech-detail"></span>
      </p>
    </div>
    <div class="frame frame-bottom"></div>
  </section>

  <!-- Two columns: left is what is held, right is what governs it.
       Each column fills the viewport height; panels scroll inside, the page never does. -->
  <div class="deck">

    <div class="col">

      <!-- 2. CHART: top left, everything else moves down under it.
           Two stacked canvases: the scene redraws on data, the hud redraws on the pointer.
           The control surface is a command line, not a toolbar: the same words the agent
           uses over MCP, typed. -->
      <section class="panel panel-chart grow" id="panel-chart">
        <div class="frame frame-top" data-title="CHART"></div>
        <div class="pbody">
          <p class="chartbar">
            <label class="k" for="product">product</label>
            <select id="product"></select>
            <span class="tfs" id="timeframes"></span>
            <label class="k" for="chart-cmd">ind</label>
            <input id="chart-cmd" type="text" autocomplete="off" spellcheck="false" placeholder="ema 21" aria-label="add an indicator, for example: ema 21">
            <span class="wait" id="chart-wait" aria-hidden="true" hidden><span>&#9617;</span><span>&#9617;</span><span>&#9617;</span></span>
            <span class="meta dim" id="chart-meta">--</span>
          </p>
          <div class="chartwrap" id="chartwrap" tabindex="0" role="img"
               aria-label="price chart: drag to pan, wheel to zoom, arrow keys to move, 0 for live">
            <canvas id="chart"></canvas>
            <canvas id="chart-hud"></canvas>
          </div>
        </div>
        <div class="frame frame-bottom"></div>
      </section>

      <!-- 3. WALLET: the whole bottom left. Two views of the same money in one panel,
           switched by the strip at the top: what is held now, and what was done to it.
           HOLDINGS is the donut and the table; TRANSACTIONS is the history. The strip
           uses the same bracket idiom as the chart's timeframes, so it stays a line of
           text on a terminal rather than becoming a tab widget.
           Each pane scrolls inside itself, so the page still never scrolls. -->
      <section class="panel panel-wallet">
        <div class="frame frame-top" data-title="WALLET"></div>
        <div class="pbody">
          <p class="tabs" role="tablist" aria-label="wallet views">
            <button type="button" class="tab on" id="tab-holdings" data-pane="holdings" role="tab" aria-selected="true" aria-controls="pane-holdings">HOLDINGS</button>
            <button type="button" class="tab" id="tab-activity" data-pane="activity" role="tab" aria-selected="false" aria-controls="pane-activity">TRANSACTIONS</button>
            <span class="tabmeta faint" id="tab-meta"></span>
          </p>

          <div class="wallet" id="pane-holdings" role="tabpanel" aria-labelledby="tab-holdings">
            <div class="donutwrap" id="donutwrap">
              <canvas id="donut"></canvas>
              <p class="readout" id="donut-readout">--</p>
            </div>
            <div class="walletgrid" id="walletgrid">
              <table class="grid" id="wallet-table">
                <thead>
                  <tr>
                    <th class="c-token">TOKEN</th>
                    <th class="c-chain">CHAIN</th>
                    <th class="c-num">QTY</th>
                    <th class="c-num">PRICE</th>
                    <th class="c-num">VALUE</th>
                    <th class="c-num">SHARE</th>
                  </tr>
                </thead>
                <tbody id="wallet-rows"></tbody>
              </table>
            </div>
          </div>

          <!-- The history. Every row is derived from a proposal this app executed and the
               hashes it produced; nothing here is authored. A row expands in place rather
               than opening anything: the brief allows no modals and no routes. -->
          <div class="txpane" id="pane-activity" role="tabpanel" aria-labelledby="tab-activity" hidden>
            <p class="txbar">
              <span class="tfs" id="tx-filters"></span>
              <span class="meta faint" id="tx-meta">--</span>
            </p>
            <div class="txgrid" id="txgrid">
              <table class="grid tx" id="tx-table">
                <thead>
                  <tr>
                    <th class="c-time">TIME</th>
                    <th class="c-action">ACTION</th>
                    <th class="c-move">MOVEMENT</th>
                    <th class="c-num c-value">VALUE</th>
                    <th class="c-addr c-from">FROM</th>
                    <th class="c-addr">TO</th>
                    <th class="c-num c-gas">GAS</th>
                    <th class="c-tx">TX</th>
                  </tr>
                </thead>
                <tbody id="tx-rows"></tbody>
              </table>
            </div>
          </div>

          <p class="totals" id="wallet-total">--</p>
        </div>
        <div class="frame frame-bottom"></div>
      </section>

    </div>

    <div class="col">

      <!-- 5. APPROVAL GATE. Never collapses: a safety surface that can be hidden
           is a safety bug. Its frame title carries no [-] for that reason. -->
      <section class="panel panel-gate">
        <div class="frame frame-top" data-title="APPROVAL GATE"></div>
        <div class="pbody">
          <div id="gate"></div>
        </div>
        <div class="frame frame-bottom"></div>
      </section>

      <!-- 6. POLICY -->
      <section class="panel panel-policy">
        <button type="button" class="frame frame-top" data-title="POLICY" data-collapse="policy" aria-expanded="true" aria-controls="policy-lines"></button>
        <div class="pbody">
          <div id="policy-lines"></div>
        </div>
        <div class="frame frame-bottom"></div>
      </section>

      <!-- 7. LOG -->
      <section class="panel panel-log grow">
        <button type="button" class="frame frame-top" data-title="LOG" data-collapse="log" aria-expanded="true" aria-controls="log"></button>
        <div class="pbody">
          <div id="log" class="log"></div>
        </div>
        <div class="frame frame-bottom"></div>
      </section>

    </div>

  </div>

  <!-- BASIC. One balance, what you own, one price, what happened, and the question
       when there is one. Every string in here is written by src/view/basic.ts and
       rendered verbatim: this file composes no sentence about money, for the same
       reason policy sentences are machine-rendered.
       The STOP control sits last and far from YES on purpose.

       Two columns on a screen wide enough for them, cut along the reading order
       rather than across it: everything that is YOURS goes down the left (the
       balance, the question, what you own), and the record goes down the right
       (what a coin costs, what happened, what the app promises, the way out). The
       wrappers exist only to be columns and hold no ids, and under 1000px basic.css
       dissolves them, so the markup order below is exactly what a phone reads top
       to bottom with nothing reordered. -->
  <section id="basic" class="basic" data-tone="calm">

    <div class="basic-col basic-col-yours">

    <div class="basic-money">
      <p class="basic-brand">PHOSPHOR</p>
      <p class="basic-total" id="basic-total">--</p>
      <p class="basic-headline" id="basic-headline">--</p>
      <p class="basic-places" id="basic-places"></p>
    </div>

    <p class="basic-warning" id="basic-warning" role="alert" hidden></p>

    <div class="basic-ask" id="basic-ask" hidden>
      <p class="basic-ask-headline" id="basic-ask-headline"></p>
      <p class="basic-ask-after" id="basic-ask-after"></p>

      <ul class="basic-facts" id="basic-facts"></ul>

      <!-- Where the money actually lands. Never truncated, never omitted: F2 shipped a
           correct amount beside a solver-chosen address described as "your wallet". -->
      <div class="basic-dests" id="basic-dests"></div>

      <div class="basic-actions">
        <button type="button" class="basic-btn basic-yes" id="basic-yes">YES, ALLOW IT</button>
        <button type="button" class="basic-btn basic-no" id="basic-no">NO</button>
      </div>
      <p class="basic-error" id="basic-error" hidden></p>
    </div>

    <!-- One row per thing owned, not one per chain. Which chain each part sits on
         is a pro-screen fact. -->
    <section class="basic-holdings" id="basic-holdings" hidden>
      <h2 class="basic-label">What you own</h2>
      <div id="basic-rows"></div>
    </section>

    </div>

    <div class="basic-col basic-col-record">

    <!-- One coin, one price, one direction. The candlestick chart is the pro screen's
         answer to a question this reader did not ask. -->
    <section class="basic-price" id="basic-price" hidden>
      <span class="basic-price-name" id="basic-price-name"></span>
      <span class="basic-price-value" id="basic-price-value"></span>
      <span class="basic-price-change" id="basic-price-change"></span>
    </section>

    <section class="basic-recent" id="basic-recent" hidden>
      <h2 class="basic-label">What happened</h2>
      <div id="basic-events"></div>
    </section>

    <p class="basic-footer" id="basic-footer"></p>

    <div class="basic-stop">
      <p class="basic-agent" id="basic-agent"></p>
      <button type="button" class="basic-btn basic-kill" id="basic-kill">STOP EVERYTHING</button>
      <p class="basic-stop-confirm" id="basic-stop-confirm" hidden>
        <span id="basic-stop-question">Are you sure?</span>
        <button type="button" class="basic-btn basic-kill-yes" id="basic-kill-yes">YES, STOP</button>
        <button type="button" class="basic-btn basic-kill-cancel" id="basic-kill-cancel">Cancel</button>
      </p>
    </div>

    </div>

  </section>

  <!-- THE CALM BAR. Full bleed across the top of the window: its thickness and colour
       are the whole state of the app. Presentational, and every state it reports is
       also stated in words above, so it carries no aria role of its own. -->
  <div class="basic-state" id="basic-state" data-tone="calm" aria-hidden="true"></div>

</main>
<!-- chart.js first: it only defines. app.js boots and calls chartBoot(). approvals.js is
     shared with the trade window so both draw a pending proposal from one renderer. -->
<script src="/chart.js" defer></script>
<script src="/approvals.js" defer></script>
<script src="/mechanism.js" defer></script>
<script src="/app.js" defer></script>
</body>
</html>
