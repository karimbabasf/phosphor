<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Phosphor</title>

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='4' fill='%23fff'/%3E%3C/svg%3E">

<link rel="preload" href="./fonts/Geist-Variable.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="./fonts/GeistMono-Variable.woff2" as="font" type="font/woff2" crossorigin>

<link rel="stylesheet" href="./design/tokens.css">
<link rel="stylesheet" href="./design/reset.css">
<link rel="stylesheet" href="./design/type.css">
<link rel="stylesheet" href="./design/components.css">
<link rel="stylesheet" href="./design/layout.css">
<link rel="stylesheet" href="./design/screens.css">
</head>
<body data-view="basic">

<div id="page">

  <div id="field" class="pattern-field" aria-hidden="true"></div>

  <header class="topbar">
    <div class="wordmark">
      <span class="wordmark-glyph" aria-hidden="true"></span>
      <span>Phosphor</span>
    </div>

    <nav class="tabs" role="tablist" aria-label="Modes">
      <button class="tab" role="tab" data-tab="basic" aria-selected="true">Basic</button>
      <button class="tab" role="tab" data-tab="pro" aria-selected="false">Pro</button>
      <button class="tab" role="tab" data-tab="trade" aria-selected="false">Trade</button>
    </nav>

    <div class="status-cluster">
      <span class="chip" id="chip-lock">
        <span class="dot" aria-hidden="true"></span>
        <span data-role="lock-text">Unlocked</span>
      </span>
      <span class="chip" id="chip-feed" hidden>
        <span class="dot" aria-hidden="true"></span>
        <span data-role="feed-text">Live</span>
      </span>
      <button class="btn btn-danger" id="btn-freeze">
        <span class="btn-label">Freeze everything</span>
      </button>
    </div>
  </header>

  <div class="offline-bar" id="offline-bar" role="status" hidden>
    <span class="dot" aria-hidden="true"></span>
    <span data-role="offline-text"></span>
  </div>

  <main class="views" id="views">
    <section class="view" id="view-basic" role="tabpanel" aria-label="Basic" data-active="true"></section>
    <section class="view" id="view-pro" role="tabpanel" aria-label="Pro"></section>
    <section class="view" id="view-trade" role="tabpanel" aria-label="Trade"></section>
  </main>

</div>

<div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-label="Waiting for you" hidden>
  <div class="overlay-card" id="overlay-card"></div>
</div>

<div class="screen" id="screen-lock" hidden></div>
<div class="screen" id="screen-firstrun" hidden></div>

<script src="./design/motion.js" defer></script>
<script src="./design/pattern.js" defer></script>
<script src="./vendor/qrcode.js" defer></script>
<script src="./theme.js" defer></script>
<script src="./split.js" defer></script>
<script src="./core/dom.js" defer></script>
<script src="./core/net.js" defer></script>
<script src="./core/events.js" defer></script>
<script src="./core/state.js" defer></script>
<script src="./core/api.js" defer></script>
<script src="./core/fixtures.js" defer></script>
<script src="./screens/feedback.js" defer></script>
<script src="./screens/receipt.js" defer></script>
<script src="./screens/activity.js" defer></script>
<script src="./screens/moneyin.js" defer></script>
<script src="./screens/agent.js" defer></script>
<script src="./screens/decision.js" defer></script>
<script src="./screens/shell.js" defer></script>
<script src="./screens/basic.js" defer></script>
<script src="./screens/pro.js" defer></script>
<script src="./screens/trade.js" defer></script>
<script src="./screens/lock.js" defer></script>
<script src="./screens/firstrun.js" defer></script>
<script src="./chart/chart.js" defer></script>
<script src="./chart/trade-overlay.js" defer></script>
<script src="./app.js" defer></script>

</body>
</html>
