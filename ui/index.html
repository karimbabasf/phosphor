<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PHOSPHOR</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<main id="page">

  <!-- 1. STATUS -->
  <header class="statusbar" id="statusbar">
    <h1 class="ident">PHOSPHOR v0.1</h1>
    <span class="bar">&#9474;</span>
    <span class="field"><span class="k">held</span> <span class="v hi" id="stat-total">--</span> <span class="faint" id="stat-gas"></span></span>
    <span class="bar">&#9474;</span>
    <span class="field"><span class="k">agent</span> <span class="v" id="stat-agent">--</span></span>
    <span class="bar">&#9474;</span>
    <span class="field"><span class="k">policy</span> <span class="v" id="stat-policy">--</span></span>
    <span class="bar">&#9474;</span>
    <span class="field"><span class="k">mode</span> <span class="v" id="stat-mode">--</span></span>
    <button type="button" id="kill-btn" class="btn">[ KILL SWITCH: -- ]</button>
    <span class="cursor" aria-hidden="true">&#9608;</span>
  </header>
  <p class="banner" id="policy-banner" hidden>POLICY FILE UNREADABLE: ALL WRITES REFUSED</p>
  <p class="alert dim" id="alert" hidden></p>

  <!-- 2. COMPOSITION -->
  <section class="panel">
    <div class="frame frame-top" data-title="COMPOSITION"></div>
    <div class="pbody">
      <table class="grid" id="comp-table">
        <thead>
          <tr>
            <th class="c-issuer">ISSUER</th>
            <th class="c-chain">CHAIN</th>
            <th class="c-symbol">SYMBOL</th>
            <th class="c-num">AMOUNT</th>
            <th class="c-num">USD</th>
            <th class="c-num">SHARE</th>
            <th class="c-frz">FRZ</th>
          </tr>
        </thead>
        <tbody id="comp-rows"></tbody>
      </table>
      <p class="totals" id="comp-total">--</p>
    </div>
    <div class="frame frame-bottom"></div>
  </section>

  <!-- 3. COST -->
  <section class="panel">
    <div class="frame frame-top" data-title="COST"></div>
    <div class="pbody">
      <p class="headline"><span class="hi" id="cost-total">--</span> <span class="dim">fragmentation cost</span></p>
      <div id="cost-lines"></div>
    </div>
    <div class="frame frame-bottom"></div>
  </section>

  <!-- 4. CHART -->
  <section class="panel">
    <div class="frame frame-top" data-title="CHART"></div>
    <div class="pbody">
      <p class="chartbar">
        <label class="k" for="product">product</label>
        <select id="product"></select>
        <span class="meta dim" id="chart-meta">--</span>
      </p>
      <canvas id="chart" height="180"></canvas>
    </div>
    <div class="frame frame-bottom"></div>
  </section>

  <!-- 5. POLICY -->
  <section class="panel">
    <div class="frame frame-top" data-title="POLICY"></div>
    <div class="pbody">
      <div id="policy-lines"></div>
    </div>
    <div class="frame frame-bottom"></div>
  </section>

  <!-- 6. APPROVAL GATE -->
  <section class="panel">
    <div class="frame frame-top" data-title="APPROVAL GATE"></div>
    <div class="pbody">
      <div id="gate"></div>
    </div>
    <div class="frame frame-bottom"></div>
  </section>

  <!-- 7. LOG -->
  <section class="panel">
    <div class="frame frame-top" data-title="LOG"></div>
    <div class="pbody">
      <div id="log" class="log"></div>
    </div>
    <div class="frame frame-bottom"></div>
  </section>

</main>
<script src="/app.js" defer></script>
</body>
</html>
